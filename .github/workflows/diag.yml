name: Diag

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - name: Xcode versions
        run: |
          xcodebuild -version
          echo "--- installed Xcodes ---"
          ls -1 /Applications | grep -i xcode || true
          echo "--- sdks ---"
          xcodebuild -showsdks | head -30
      - name: XcodeGen version
        run: |
          brew install xcodegen >/dev/null 2>&1 || true
          xcodegen --version
